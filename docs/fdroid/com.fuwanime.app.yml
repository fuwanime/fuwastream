Id: com.fuwanime.app
Name: FuwaStream
Summary: Aplikasi streaming anime untuk Android (Jetpack Compose + Material 3)
Description: |
  FuwaStream adalah aplikasi Android untuk streaming anime, ditulis ulang dengan
  Jetpack Compose + Material 3.
  
  Fitur utama:
  - Beranda: carousel unggulan, Lanjutkan Nonton, anime yang tayang hari ini
  - Jelajah: pencarian dengan riwayat, filter genre, status dan tipe konten
  - Jadwal: tab per hari beserta jam rilis episode
  - Detail: daftar episode lengkap, pencarian nomor episode, progres tontonan, favorit
  - Pemutar (Media3 ExoPlayer): pilih kualitas dan kecepatan (0.5×–2×), PiP, download offline
  - Koleksi: riwayat tontonan dengan progres, daftar favorit, unduhan offline
  - Pengaturan: tema sistem/terang/gelap, Material You, hitam AMOLED
  
  Konten berasal dari API pihak ketiga. Aplikasi ini tidak meng-host video apa pun.
